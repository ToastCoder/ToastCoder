  <g class="profile-info">
  <text x="674.4" y="162.6" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12"><tspan fill="#3d444d">─</tspan><tspan fill="#58a6ff"> ToastCoder@github </tspan><tspan fill="#3d444d">──────────────────────────────────────</tspan></text>
  <text x="674.4" y="182.6" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="16"><tspan fill="#ffa657">. Location: </tspan><tspan fill="#c9d1d9">Bengaluru, India</tspan></text>
  <text x="674.4" y="202.6" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="16"><tspan fill="#ffa657">. AI/ML: </tspan><tspan fill="#c9d1d9">LLMs, RAG, Agentic AI, NLP, Computer Vision</tspan></text>
  <text x="674.4" y="242.6" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12"><tspan fill="#3d444d">─</tspan><tspan fill="#58a6ff"> Skills </tspan><tspan fill="#3d444d">────────────────────────────────────────────────────</tspan></text>
  <text x="674.4" y="262.6" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12"><tspan fill="#ffa657">. AI &amp; LLMs: </tspan><tspan fill="#c9d1d9">Large Language Models (LLMs), RAG, Agentic AI, NLP, Prompt Engineering,</tspan><tspan x="674.4" dy="16" fill="#c9d1d9">Transformer Models</tspan></text>
  <text x="674.4" y="298.6" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12"><tspan fill="#ffa657">. ML &amp; Deep Learning: </tspan><tspan fill="#c9d1d9">Machine Learning, Computer Vision, Semantic Segmentation,</tspan><tspan x="674.4" dy="16" fill="#c9d1d9">Object Detection, Audio Classification, Image Processing</tspan></text>
  <text x="674.4" y="334.6" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12"><tspan fill="#ffa657">. Frameworks &amp; Libraries: </tspan><tspan fill="#c9d1d9">LangGraph, LangChain, PyTorch, TensorFlow, Keras, OpenCV,</tspan><tspan x="674.4" dy="16" fill="#c9d1d9">Pytesseract-OCR, Pandas, NumPy, Matplotlib, Streamlit, ChromaDB</tspan></text>
  <text x="674.4" y="370.6" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12"><tspan fill="#ffa657">. Dev Stack: </tspan><tspan fill="#c9d1d9">Python, C/C++, Bash, Docker</tspan></text>
  <text x="674.4" y="390.6" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12"><tspan fill="#ffa657">. Systems: </tspan><tspan fill="#c9d1d9">Linux internals, POSIX environments, shell automation</tspan></text>
  <text x="674.4" y="410.6" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12"><tspan fill="#ffa657">. Cloud: </tspan><tspan fill="#c9d1d9">Azure App Service, Azure OpenAI, CI/CD pipelines</tspan></text>
  <text x="674.4" y="450.6" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12"><tspan fill="#3d444d">─</tspan><tspan fill="#58a6ff"> Projects </tspan><tspan fill="#3d444d">───────────────────────────────────────────────</tspan></text>
  <text x="674.4" y="470.6" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12"><tspan fill="#ffa657">. OpenCortex: </tspan><tspan fill="#c9d1d9">Private, multimodal, self-hosted document intelligence</tspan></text>
  <text x="674.4" y="490.6" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12"><tspan fill="#ffa657">. shell-agent: </tspan><tspan fill="#c9d1d9">An autonomous AI agent that lives in your terminal</tspan></text>
  <text x="674.4" y="510.6" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12"><tspan fill="#ffa657">. AnalyzeMyCV: </tspan><tspan fill="#c9d1d9">AI-powered resume analyzer</tspan><tspan x="674.4" dy="16" fill="#c9d1d9">built on Azure OpenAI and deployed live on Azure App Service.</tspan></text>
  <text x="674.4" y="542.6" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12"><tspan fill="#ffa657">. HRBuddy: </tspan><tspan fill="#c9d1d9">HR chatbot powered by Llama + Nomic embeddings</tspan><tspan x="674.4" dy="16" fill="#c9d1d9">with a strict RAG context pipeline.</tspan></text>
  <text x="674.4" y="582.6" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12"><tspan fill="#3d444d">─</tspan><tspan fill="#58a6ff"> Contact </tspan><tspan fill="#3d444d">────────────────────────────────────────────────</tspan></text>
  <text x="674.4" y="602.6" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12"><tspan fill="#ffa657">. Email: </tspan><tspan fill="#c9d1d9">hellovigkr@gmail.com</tspan></text>
  <text x="674.4" y="622.6" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="12"><tspan fill="#ffa657">. LinkedIn: </tspan><tspan fill="#c9d1d9">linkedin.com/in/toastcoder</tspan></text>
